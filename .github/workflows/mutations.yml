name: MU mutation operators
on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  mutation-tests:
    name: recovery-mutation-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 228a16b7197e75253cf2426d700cf23eb8c3b13f
      - name: Verify exact historical source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "228a16b7197e75253cf2426d700cf23eb8c3b13f"
          printf 'verified_source_sha=%s\n' "$(git rev-parse HEAD)"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --no-sync python -m unittest discover -s tests -p test_mutations.py -v
