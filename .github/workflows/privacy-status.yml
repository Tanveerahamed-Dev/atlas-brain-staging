name: Privacy and gate-data regressions
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '42 22 * * *'
permissions:
  contents: read
concurrency:
  group: privacy-status-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false
env:
  ATLAS_TEST_MARKER: ${{ github.run_id }}-synthetic-canary
jobs:
  privacy-status:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10 # budget: 5 minutes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q tests/test_fence.py tests/test_privacy.py
      - run: uv run --no-sync python tools/fence.py
