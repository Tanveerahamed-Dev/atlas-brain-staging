name: S0 spike (never merge pipeline)
on:
  push:
    branches: [s0/spike]
    paths:
      - '.github/workflows/s0-spike.yml'
      - 'tools/scale/**'
      - 'spike/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      tier:
        type: choice
        description: Measurement tier; full follows successful pilots
        options: [pilot, full, qualification]
        default: pilot
permissions:
  contents: read
defaults:
  run:
    shell: pwsh
jobs:
  smoke:
    if: github.ref == 'refs/heads/s0/spike'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.8'
      - name: Prepare separate standard-library runtime
        run: |
          python -m venv --without-pip .s0/runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $runtime = if ($IsWindows) { '.s0/runtime/Scripts/python.exe' } else { '.s0/runtime/bin/python' }
          "S0_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $runtime -I -S tools/scale/prepare.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $runtime -I -X warn_default_encoding -W error::EncodingWarning tools/scale/smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install psutil==7.2.2
          exit $LASTEXITCODE
      - name: End-to-end 100-device smoke (uncapped, not acceptance)
        run: python tools/scale/measure.py --runtime $env:S0_RUNTIME --sizes 100 --repetitions 1 --host --raw .s0/smoke/raw
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: smoke-${{ matrix.os }}-${{ github.sha }}
          path: |
            .s0/smoke/raw/
            .s0/prestart-census.json
          if-no-files-found: error
          retention-days: 90
  pilot:
    needs: smoke
    if: contains(github.event.head_commit.message, '[measure]') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.8'
      - name: Prepare harness and separate runtime
        run: |
          python -m pip install psutil==7.2.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m venv --without-pip .s0/runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $runtime = if ($IsWindows) { '.s0/runtime/Scripts/python.exe' } else { '.s0/runtime/bin/python' }
          "S0_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $runtime -I -S tools/scale/prepare.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not $IsWindows) { docker pull python:3.14.8-slim }
          exit $LASTEXITCODE
      - name: Five cold-first runs at each pilot size, hard 2 GiB cap
        run: python tools/scale/measure.py --runtime $env:S0_RUNTIME --sizes 100 300 --repetitions 5 --raw .s0/pilot/raw
      - name: Summarize without extrapolating the runner
        if: always()
        run: python tools/scale/thresholds.py .s0/pilot/raw .s0/pilot/thresholds.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pilot-${{ matrix.os }}-${{ github.sha }}
          path: |
            .s0/pilot/
            .s0/prestart-census.json
          if-no-files-found: error
          retention-days: 90
  full:
    needs: pilot
    if: contains(github.event.head_commit.message, '[full]') || inputs.tier == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.8'
      - name: Prepare harness and separate runtime
        run: |
          python -m pip install psutil==7.2.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m venv --without-pip .s0/runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $runtime = if ($IsWindows) { '.s0/runtime/Scripts/python.exe' } else { '.s0/runtime/bin/python' }
          "S0_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $runtime -I -S tools/scale/prepare.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not $IsWindows) { docker pull python:3.14.8-slim }
          exit $LASTEXITCODE
      - name: Five full-volume runs, hard 2 GiB cap
        run: python tools/scale/measure.py --runtime $env:S0_RUNTIME --sizes 1000 --repetitions 5 --raw .s0/full/raw
      - name: One dense stress run, hard 4 GiB cap
        run: python tools/scale/measure.py --runtime $env:S0_RUNTIME --sizes 1000 --repetitions 1 --dense --raw .s0/full/raw
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-${{ matrix.os }}-${{ github.sha }}
          path: .s0/full/
          if-no-files-found: error
          retention-days: 90
