name: S0 spike (never merge pipeline)
on:
  push:
    branches: [s0/spike]
    paths:
      - '.github/workflows/s0-spike.yml'
      - 'tools/scale/**'
      - 'spike/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      tier:
        type: choice
        description: Measurement tier; full follows successful pilots
        options: [pilot, full, qualification]
        default: pilot
permissions:
  contents: read
defaults:
  run:
    shell: pwsh
jobs:
  smoke:
    if: github.ref == 'refs/heads/s0/spike'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.8'
      - name: Prepare separate standard-library runtime
        run: |
          python -m venv --without-pip .s0/runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $runtime = if ($IsWindows) { '.s0/runtime/Scripts/python.exe' } else { '.s0/runtime/bin/python' }
          "S0_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $runtime -I -S tools/scale/prepare.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $runtime -I -X warn_default_encoding -W error::EncodingWarning tools/scale/smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install psutil==7.2.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X warn_default_encoding -W error::EncodingWarning -m unittest tools.scale.test_sampler -v
          exit $LASTEXITCODE
      - name: End-to-end 100-device smoke (uncapped, not acceptance)
        run: python tools/scale/measure.py --runtime $env:S0_RUNTIME --sizes 100 --repetitions 1 --host --raw .s0/smoke/raw
      - name: Validate all six checks and both correlation variants
        run: python tools/scale/check_smoke.py .s0/smoke/raw/wl1-100-1
      - name: Egress probes in coordinator, worker, retry and import
        run: |
          & $env:S0_RUNTIME -I -X utf8=1 -X warn_default_encoding -W error::EncodingWarning spike/probe_entry.py .s0/smoke/raw/egress.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: smoke-${{ matrix.os }}-${{ github.sha }}
          path: |
            .s0/smoke/raw/
            .s0/prestart-census.json
          if-no-files-found: error
          retention-days: 90
  pilot:
    needs: smoke
    if: contains(github.event.head_commit.message, '[measure]') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.8'
      - name: Prepare harness and separate runtime
        run: |
          python -m pip install psutil==7.2.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m venv --without-pip .s0/runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $runtime = if ($IsWindows) { '.s0/runtime/Scripts/python.exe' } else { '.s0/runtime/bin/python' }
          "S0_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $runtime -I -S tools/scale/prepare.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not $IsWindows) { docker pull python:3.14.8-slim }
          exit $LASTEXITCODE
      - name: Five cold-first runs at each pilot size, hard 2 GiB cap
        run: python tools/scale/measure.py --runtime $env:S0_RUNTIME --sizes 100 300 --repetitions 5 --raw .s0/pilot/raw
      - name: Reachable positive control and confined OS witness
        if: runner.os == 'Linux'
        run: python tools/scale/os_witness.py .s0/pilot/os-witness.json
      - name: Summarize without extrapolating the runner
        if: always()
        run: python tools/scale/thresholds.py .s0/pilot/raw .s0/pilot/thresholds.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pilot-${{ matrix.os }}-${{ github.sha }}
          path: |
            .s0/pilot/
            .s0/prestart-census.json
          if-no-files-found: error
          retention-days: 90
  full:
    needs: pilot
    if: contains(github.event.head_commit.message, '[full]') || inputs.tier == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.8'
      - name: Prepare harness and separate runtime
        run: |
          python -m pip install psutil==7.2.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m venv --without-pip .s0/runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $runtime = if ($IsWindows) { '.s0/runtime/Scripts/python.exe' } else { '.s0/runtime/bin/python' }
          "S0_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $runtime -I -S tools/scale/prepare.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not $IsWindows) { docker pull python:3.14.8-slim }
          exit $LASTEXITCODE
      - name: Five runs at all sizes on this same runner, hard 2 GiB cap
        run: python tools/scale/measure.py --runtime $env:S0_RUNTIME --sizes 100 300 1000 --repetitions 5 --raw .s0/full/raw
      - name: One dense stress run, hard 4 GiB cap
        run: python tools/scale/measure.py --runtime $env:S0_RUNTIME --sizes 1000 --repetitions 1 --dense --raw .s0/full/raw
      - name: Enforce same-runner thresholds without changing any budget
        run: python tools/scale/thresholds.py .s0/full/raw .s0/full/thresholds.json --os-name ${{ runner.os }}
      - name: Separate full unconfined-host equality witness
        if: runner.os == 'Linux'
        run: |
          python tools/scale/measure.py --runtime $env:S0_RUNTIME --sizes 1000 --repetitions 1 --host --raw .s0/full/host-comparison
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/scale/compare_full.py .s0/full/raw .s0/full/host-comparison
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-${{ matrix.os }}-${{ github.sha }}
          path: .s0/full/
          if-no-files-found: error
          retention-days: 90
  determinism:
    needs: pilot
    if: contains(github.event.head_commit.message, '[qualify]') || inputs.tier == 'qualification'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.14.8', '3.15.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare profile
        run: |
          python -m pip install psutil==7.2.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m venv --without-pip .s0/runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $runtime = if ($IsWindows) { '.s0/runtime/Scripts/python.exe' } else { '.s0/runtime/bin/python' }
          "S0_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $runtime -I -S tools/scale/prepare.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not $IsWindows) { docker pull python:${{ matrix.python }}-slim }
          exit $LASTEXITCODE
      - name: Run six of the twelve covering rows
        run: python tools/scale/runtime_checks.py determinism --runtime $env:S0_RUNTIME --interpreter ${{ matrix.python }} --raw .s0/determinism
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: determinism-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: .s0/determinism/
          if-no-files-found: error
          retention-days: 90
  stability:
    needs: pilot
    if: contains(github.event.head_commit.message, '[qualify]') || inputs.tier == 'qualification'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        recycle: ['none', '3']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.8'
      - name: Prepare profile
        run: |
          python -m pip install psutil==7.2.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m venv --without-pip .s0/runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $runtime = if ($IsWindows) { '.s0/runtime/Scripts/python.exe' } else { '.s0/runtime/bin/python' }
          "S0_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $runtime -I -S tools/scale/prepare.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not $IsWindows) { docker pull python:3.14.8-slim }
          exit $LASTEXITCODE
      - name: Twenty consecutive 300-device runs
        run: python tools/scale/runtime_checks.py stability --runtime $env:S0_RUNTIME --recycle ${{ matrix.recycle }} --raw .s0/stability
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stability-${{ matrix.os }}-${{ matrix.recycle }}-${{ github.sha }}
          path: .s0/stability/
          if-no-files-found: error
          retention-days: 90
  faults:
    needs: pilot
    if: contains(github.event.head_commit.message, '[qualify]') || inputs.tier == 'qualification'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.8'
      - name: Prepare profile
        run: |
          python -m pip install psutil==7.2.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m venv --without-pip .s0/runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $runtime = if ($IsWindows) { '.s0/runtime/Scripts/python.exe' } else { '.s0/runtime/bin/python' }
          "S0_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $runtime -I -S tools/scale/prepare.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not $IsWindows) { docker pull python:3.14.8-slim }
          exit $LASTEXITCODE
      - name: Kill, retry, double kill, cancel, MemoryError and pack exception
        run: python tools/scale/runtime_checks.py faults --runtime $env:S0_RUNTIME --raw .s0/faults
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: faults-${{ matrix.os }}-${{ github.sha }}
          path: .s0/faults/
          if-no-files-found: error
          retention-days: 90
  worker-growth:
    needs: smoke
    if: contains(github.event.head_commit.message, '[closure]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.8'
      - name: Prepare external sampler and standard-library runtime
        run: |
          python -m pip install psutil==7.2.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m venv --without-pip .s0/runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $runtime = if ($IsWindows) { '.s0/runtime/Scripts/python.exe' } else { '.s0/runtime/bin/python' }
          "S0_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $runtime -I -S tools/scale/prepare.py
          exit $LASTEXITCODE
      - name: First-task plateau and subsequent resident memory per worker
        run: python tools/scale/growth.py --runtime $env:S0_RUNTIME --raw .s0/growth
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: growth-${{ matrix.os }}-${{ github.sha }}
          path: .s0/growth/
          if-no-files-found: error
          retention-days: 90
  windows-locked-install:
    needs: smoke
    if: contains(github.event.head_commit.message, '[locked]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.14.8', '3.15.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a02c5c52a118ee2b55ed770c830c1f2d0fade6b0
          path: .s0/locked-subject
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.1'
          enable-cache: false
      - name: Install the full declared runtime and development lock natively
        run: |
          New-Item -ItemType Directory -Force .s0/locked-install | Out-Null
          python -m pip install psutil==7.2.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv --version > .s0/locked-install/uv-version.txt
          uv sync --locked --no-dev --python ${{ matrix.python }} --project .s0/locked-subject *> .s0/locked-install/runtime-install.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/scale/locked_install.py --subject .s0/locked-subject --profile runtime --out .s0/locked-install/runtime.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv sync --locked --python ${{ matrix.python }} --project .s0/locked-subject *> .s0/locked-install/dev-install.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/scale/locked_install.py --subject .s0/locked-subject --profile dev --out .s0/locked-install/dev.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C .s0/locked-subject diff --exit-code
          exit $LASTEXITCODE
      - name: Exercise installed development executables
        working-directory: .s0/locked-subject
        run: |
          uv run --no-sync --python ${{ matrix.python }} pytest --version > ../locked-install/pytest-version.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run --no-sync --python ${{ matrix.python }} ruff --version > ../locked-install/ruff-version.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run --no-sync --python ${{ matrix.python }} pyright --version > ../locked-install/pyright-version.txt
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: locked-install-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: .s0/locked-install/
          if-no-files-found: error
          retention-days: 90
  startup-admission:
    needs: smoke
    if: contains(github.event.head_commit.message, '[startup]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.14.8', '3.15.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Record clean coordinator and spawn-worker module baselines twice
        run: |
          python -m pip install psutil==7.2.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m venv --without-pip .s0/runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $runtime = if ($IsWindows) { '.s0/runtime/Scripts/python.exe' } else { '.s0/runtime/bin/python' }
          "S0_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $runtime -I -S tools/scale/prepare.py
          exit $LASTEXITCODE
      - name: Qualify all five startup-hook classes before and after the census
        run: python tools/scale/startup_checks.py --runtime $env:S0_RUNTIME --raw .s0/startup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: startup-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          include-hidden-files: true
          path: |
            .s0/startup/
            .s0/startup-*.json
            .s0/import-closure.json
          if-no-files-found: error
          retention-days: 90
